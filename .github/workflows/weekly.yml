name: weekly-retrain

on:
  schedule:
    - cron: "0 4 * * 0"   # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Fetch data
        run: python -m backend.fetch
      - name: Train
        run: python -m backend.train
      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Commit model
        run: |
          git config user.name "elpris-bot"
          git config user.email "elpris-bot@users.noreply.github.com"
          git add models
          git diff --cached --quiet || git commit -m "Omträning $(date -u +%F)"
          git push
